name: Nix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix-flake-check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --accept-flake-config --no-update-lock-file -c bash scripts/push-missing-to-cachix.test.sh scripts/push-missing-to-cachix.sh
      - run: nix flake check --accept-flake-config --no-update-lock-file --print-build-logs

  cache-system:
    name: cache-system
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Free space for the desktop system closure
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /nix
      - name: Prepare the portal validator sandbox
        run: |
          test "$(id -u)" -ne 0
          bwrap="$(nix eval --accept-flake-config --no-update-lock-file --raw .#nixosConfigurations.jupiter.pkgs.bubblewrap.outPath)/bin/bwrap"
          nix build --accept-flake-config --no-update-lock-file --no-link .#nixosConfigurations.jupiter.pkgs.bubblewrap
          if "$bwrap" --unshare-user --unshare-net --unshare-pid --ro-bind / / --proc /proc /bin/true; then
            exit 0
          fi
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          printf 'abi <abi/4.0>,\nprofile nix-cache-bubblewrap-%s-%s %s flags=(unconfined) {\n  userns,\n}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$bwrap" > "$RUNNER_TEMP/nix-cache-bubblewrap.apparmor"
          sudo apparmor_parser --add "$RUNNER_TEMP/nix-cache-bubblewrap.apparmor"
          "$bwrap" --unshare-user --unshare-net --unshare-pid --ro-bind / / --proc /proc /bin/true
      - name: Build the locked system closure
        run: |
          nix build --accept-flake-config --no-update-lock-file \
            --out-link "$RUNNER_TEMP/cache-result" --print-out-paths --print-build-logs \
            .#nixosConfigurations.jupiter.config.system.build.toplevel > "$RUNNER_TEMP/cache-paths"
          nix path-info --recursive $(cat "$RUNNER_TEMP/cache-paths") > "$RUNNER_TEMP/cache-closure"
      - name: Remove the portal validator profile
        if: always()
        run: |
          if test -e "$RUNNER_TEMP/nix-cache-bubblewrap.apparmor"; then
            sudo apparmor_parser --remove "$RUNNER_TEMP/nix-cache-bubblewrap.apparmor"
            rm "$RUNNER_TEMP/nix-cache-bubblewrap.apparmor"
          fi
      - name: Push only paths missing from all configured caches
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          : "${CACHIX_AUTH_TOKEN:?Set the repository secret CACHIX_AUTH_TOKEN}"
          nix develop --accept-flake-config --no-update-lock-file -c bash scripts/push-missing-to-cachix.sh nix-config-shishi "$RUNNER_TEMP/cache-paths"
      - name: Verify the complete closure is downloadable
        run: |
          rm "$RUNNER_TEMP/cache-result"
          nix store gc
          nix develop --accept-flake-config --no-update-lock-file -c bash scripts/verify-system-cache.sh "$RUNNER_TEMP/cache-paths" "$RUNNER_TEMP/cache-closure"
