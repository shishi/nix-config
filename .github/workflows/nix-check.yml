name: Nix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix-flake-check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/push-missing-to-cachix.test.sh scripts/push-missing-to-cachix.sh
      - run: nix flake check --accept-flake-config --no-update-lock-file --print-build-logs

  cache-brave:
    name: cache-brave
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build locked Brave and Cachix
        run: |
          nix build --accept-flake-config --no-update-lock-file \
            --out-link "$RUNNER_TEMP/brave-result" --print-out-paths --print-build-logs \
            .#packages.x86_64-linux.brave > "$RUNNER_TEMP/brave-paths"
          nix build --accept-flake-config --no-update-lock-file \
            --inputs-from . --out-link "$RUNNER_TEMP/cachix-result" nixpkgs#cachix
          test -x "$RUNNER_TEMP/cachix-result-bin/bin/cachix"
          echo "$RUNNER_TEMP/cachix-result-bin/bin" >> "$GITHUB_PATH"
      - name: Push only official-cache misses
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          : "${CACHIX_AUTH_TOKEN:?Set the repository secret CACHIX_AUTH_TOKEN}"
          bash scripts/push-missing-to-cachix.sh nix-config-shishi "$RUNNER_TEMP/brave-paths"
