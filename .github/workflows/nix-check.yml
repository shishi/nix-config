name: Cachix inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Read capacity only
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          INSPECTION_RECIPIENT: age1jrq9s0yvqzle23m5mawh032g2zjjfkh8056wd7vxgnjkypj5qu5s7azt8p
        run: nix develop --accept-flake-config --no-update-lock-file -c python3 scripts/cachix-inspect.py
